<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>200-Day MA Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<style>
  /* Dashboard colors (Pico handles everything else, including light/dark) */
  :root { --up:#15803d; --down:#b91c1c; --line:#2563eb; --ma:#f59e0b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --up:#4ade80; --down:#f87171; --line:#60a5fa; --ma:#fbbf24; }
  }

  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:1rem; margin-bottom:1rem; }
  .stats article { margin:0; padding:.9rem 1.1rem; }
  .stats small { display:block; color:var(--pico-muted-color); }
  .stats b { font-size:1.4rem; }
  .above { color:var(--up); }
  .below { color:var(--down); }

  #tabs { margin-bottom:1rem; }
  .chart { position:relative; height:380px; }
  footer small { color:var(--pico-muted-color); }
</style>
</head>
<body>
<main class="container">
  <hgroup>
    <h1>200-Day Moving Average</h1>
    <p>End-of-day close versus the 200-day simple moving average.</p>
  </hgroup>

  <div role="group" id="tabs"></div>
  <section class="stats" id="cards"></section>
  <article>
    <div class="chart"><canvas id="chart"></canvas></div>
  </article>

  <footer><small id="foot"></small></footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
let chart, store, current;

async function init() {
  try {
    // Relative path works on GitHub Pages and Cloudflare Pages
    const res = await fetch("data/latest.json?t=" + Date.now());
    store = await res.json();
  } catch (e) {
    store = {};
  }

  const syms = Object.keys(store.symbols || {});
  if (!syms.length) {
    document.getElementById("cards").textContent =
      "No data yet. Run the GitHub Action once (Actions tab → Update 200MA → Run workflow).";
    return;
  }

  const tabs = document.getElementById("tabs");
  syms.forEach((s) => {
    const b = document.createElement("button");
    b.textContent = s;
    b.onclick = () => show(s);
    tabs.appendChild(b);
  });
  show(syms[0]);

  document.getElementById("foot").textContent =
    "Data: Tiingo (end of day). Last updated " + new Date(store.updated).toLocaleString();

  // Redraw the chart if the system switches between light and dark
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(current));
}

function show(sym) {
  current = sym;
  const d = store.symbols[sym];

  document.querySelectorAll("#tabs button").forEach((b) => {
    const active = b.textContent === sym;
    b.className = active ? "" : "secondary outline";
    b.setAttribute("aria-current", active ? "true" : "false");
  });

  const cls = d.state;
  const sign = d.pctFromMA > 0 ? "+" : "";
  document.getElementById("cards").innerHTML = `
    <article><small>Status</small><b class="${cls}">${d.state.toUpperCase()}</b></article>
    <article><small>Close (${d.date})</small><b>${d.close.toFixed(2)}</b></article>
    <article><small>200 MA</small><b>${d.ma.toFixed(2)}</b></article>
    <article><small>Distance</small><b class="${cls}">${sign}${d.pctFromMA}%</b></article>
    <article><small>Days in state</small><b>${d.daysInState}</b></article>`;

  const css = getComputedStyle(document.documentElement);
  const get = (v) => css.getPropertyValue(v).trim();
  const textColor = get("--pico-muted-color") || "#888";
  const gridColor = get("--pico-muted-border-color") || "rgba(128,128,128,.2)";

  const cfg = {
    type: "line",
    data: {
      labels: d.series.map((p) => p.d),
      datasets: [
        { label: sym + " close", data: d.series.map((p) => p.c), borderColor: get("--line"), pointRadius: 0, borderWidth: 1.5 },
        { label: "200 MA", data: d.series.map((p) => p.ma), borderColor: get("--ma"), pointRadius: 0, borderWidth: 2 },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: textColor } } },
      scales: {
        x: { ticks: { maxTicksLimit: 8, color: textColor }, grid: { color: gridColor } },
        y: { ticks: { color: textColor }, grid: { color: gridColor } },
      },
    },
  };

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), cfg);
}

init();
</script>
</body>
</html>
